name: Build Fedora RPM

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build rpmdevtools rust cargo gcc cmake pkg-config \
            glib2-devel gtk4-devel libadwaita-devel openssl-devel protobuf-compiler appstream tar

      - name: Set up RPM build tree
        run: |
          rpmdev-setuptree

      - name: Prepare source tarball
        run: |
          VERSION=$(grep -m1 '^Version:' anime-game-launcher.spec | awk '{print $2}')
          NAME=$(grep -m1 '^Name:' anime-game-launcher.spec | awk '{print $2}')
          mkdir -p /tmp/build-sources/an-${NAME}-${VERSION}
          cp -a . /tmp/build-sources/an-${NAME}-${VERSION}/
          tar -czf ~/rpmbuild/SOURCES/${NAME}-${VERSION}.tar.gz -C /tmp/build-sources an-${NAME}-${VERSION}

      - name: Copy spec file
        run: |
          cp anime-game-launcher.spec ~/rpmbuild/SPECS/

      - name: Build RPM
        run: |
          rpmbuild -ba ~/rpmbuild/SPECS/anime-game-launcher.spec

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-rpm
          path: |
            ~/rpmbuild/RPMS/**/*.rpm
            ~/rpmbuild/SRPMS/*.rpm

      # Fix ownership so the next step (running outside the container's root)
      # can read files created by rpmbuild inside the Fedora container.
      - name: Fix permissions for release step
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          chmod -R a+rX ~/rpmbuild/RPMS ~/rpmbuild/SRPMS

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /github/home/rpmbuild/RPMS/**/*.rpm
            /github/home/rpmbuild/SRPMS/*.rpm
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
